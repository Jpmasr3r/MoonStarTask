<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
    <title>Sistema de Gerenciamento de Tarefas</title>
</head>


<body>
    <header>
        <h1 id="h1Title">Gerenciador Tarefas</h1>
        <button id="btnAddTask" type="button">Nova Tarefa +</button>
        <button id="btnFilterTask" type="button">Filtrar</button>
        <button id="btnToggleTheme" type="button"><img id="imgToggleTheme" src="images/tema-escuro.svg"
                alt="Theme"></button>
        <button id="btnToggleMusic" type="button" aria-label="Tocar música" aria-pressed="false"
            title="Tocar música"><img id="imgToggleMusic" src="images/nota-musical-claro.svg" alt=""></button>
    </header>

    <div id="divTasks">
        <!-- <div class="divTask">
            <h1 class="h1TaskTitle">Teste</h1>
            <p class="pTaskDescription">Lorem ipsum dolor sit amet consectetur adipisicing elit. Est consectetur, velit
                distinctio in modi deserunt id commodi! Repe</p>
            <button class="btnTaskRemove" type="button">X</button>
            <button class="btnTaskUpdate" type="button">Update</button>
        </div> -->
    </div>

    <div id="divFloatCreateTask">
        <input type="text" placeholder="Titulo" name="title" id="inpFloatCreateTitle">
        <textarea placeholder="Descrição" name="description" id="inpFloatCreateDescription" rows="4"></textarea>
        <button id="btnFloatCreate" type="button">Criar</button>
    </div>

    <div id="divFloatUpdateTask">
        <input type="text" name="title" placeholder="Titulo" id="inpFloatUpdateTitle">
        <textarea name="description" placeholder="Descrição" id="inpFloatUpdateDescription" rows="4"></textarea>
        <button id="btnFloatUpdate" type="button">Atualizar</button>
    </div>

    <div id="divFloatFilterTask">
        <input type="text" name="title" placeholder="Titulo" id="inpFloatFilterTitle">
        <textarea name="description" placeholder="Descrição" id="inpFloatFilterDescription" rows="4"></textarea>
        <button id="btnFloatFilter" type="button">Filtrar</button>
    </div>

    <!-- biome-ignore lint/a11y/useMediaCaption: Música instrumental sem conteúdo falado. -->
    <audio id="audBackgroundMusic" loop>
        <source src="./audio/moonsetter.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <footer>

    </footer>
</body>


</html>
